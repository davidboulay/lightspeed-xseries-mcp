name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Read-only tests (locked deps)
        run: uv run --python ${{ matrix.python }} --with-requirements requirements.lock --with-editable . python -m unittest discover -s tests -v
