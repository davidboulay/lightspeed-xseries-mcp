[project]
name = "lightspeed-xseries-mcp"
version = "1.0.0"
description = "Read-only MCP server for Lightspeed Retail (X-Series): sales, stock, products, customers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Boulay" }]
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3"]
keywords = ["mcp", "lightspeed", "x-series", "vend", "retail", "pos", "claude"]

[project.urls]
Repository = "https://github.com/davidboulay/lightspeed-xseries-mcp"

[project.scripts]
lightspeed-xseries-mcp = "lightspeed_xseries_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
